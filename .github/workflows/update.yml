name: Update stores

# Append the newest GoMOFS cycles to the Icechunk stores and replace their forecast tail.
# Best-effort by design: every run diffs the store against NOAA's bucket and does only the
# missing work, so a failed or skipped run needs no retry. Every run also writes the store status
# to the step summary and re-enables this workflow so GitHub's 60-day inactivity rule never
# disables the schedule. See docs/operations.md.

on:
  workflow_dispatch:
  schedule:
    # four cycles a day, each published a few hours before it is valid; exact timing does not
    # matter because each run catches up on whatever is new
    - cron: "25 */3 * * *"

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  update:
    name: Update ${{ matrix.variant }}
    runs-on: ubuntu-latest
    if: vars.GOMOFS_S3_BUCKET != '' && vars.SOURCE_COOP_SERVICE_ACCOUNT != ''
    environment: source-coop # trust is scoped to this environment (main only)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ["3d", "2d"]
    # Exactly one writer per store, ever. Queued runs wait; nothing is cancelled mid-commit.
    concurrency:
      group: gomofs-store-${{ matrix.variant }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC sign-in as the Source Coop service account
    env:
      GOMOFS_S3_BUCKET: ${{ vars.GOMOFS_S3_BUCKET }}
      GOMOFS_S3_PREFIX: ${{ vars.GOMOFS_S3_PREFIX || 'noaa-gomofs' }}
      GOMOFS_S3_REGION: ${{ vars.GOMOFS_S3_REGION || 'us-west-2' }}
      GOMOFS_S3_ENDPOINT: ${{ vars.GOMOFS_S3_ENDPOINT || 'https://data.source.coop' }}
      GOMOFS_S3_ACL: ${{ vars.GOMOFS_S3_ACL || 'bucket-owner-full-control' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Source Cooperative (service account)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.SOURCE_COOP_SERVICE_ACCOUNT }}:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2
          # Icechunk keeps the first credentials it reads (no mid-run renewal); outlive timeout-minutes.
          role-duration-seconds: 7200

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Append new cycles
        run: gomofs update ${{ matrix.variant }}

      # Runs even after a failed update so the summary still shows where the store stands.
      - name: Store status
        if: always()
        run: |
          # Redirect rather than pipe through tee: the default shell has no pipefail.
          gomofs status ${{ matrix.variant }} --format markdown > status.md || status=$?
          cat status.md
          cat status.md >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  keepalive:
    name: Keepalive
    runs-on: ubuntu-latest
    needs: update
    if: always() && vars.GOMOFS_S3_BUCKET != '' && vars.SOURCE_COOP_SERVICE_ACCOUNT != ''
    timeout-minutes: 5
    permissions:
      actions: write # re-enable this workflow
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # GitHub disables scheduled workflows in public repos after 60 days without repo activity.
      # Re-enabling an already-enabled workflow resets that clock (undocumented, but what
      # keepalive-workflow v2 relies on).
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
