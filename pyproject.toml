[project]
name = "noaa-gomofs-icechunk"
version = "0.1.0"
description = "Keep the NOAA GoMOFS virtual Icechunk stores up to date"
requires-python = ">=3.12"
dependencies = [
    "icechunk>=2.3",
    "virtualizarr[hdf]>=2.8",
    "obstore",
    "obspec-utils",
    "xarray",
    "zarr>=3.1",
    "numpy",
    "pandas",
    "fsspec",
    "s3fs",
]

[project.scripts]
gomofs = "noaa_gomofs_icechunk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noaa_gomofs_icechunk"]
